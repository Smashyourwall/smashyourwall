<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>About Me — Smash Your Wall</title>

  <style>
    :root {
      --white: #ffffff;
      --gray: #e2e2e0;
      --text: #171717;
      --muted: #666666;
      --accent: #a94f32;
      --border: #d2d2d0;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.7;
    }

    /* NAV */

    nav {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .nav-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      color: var(--text);
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a:hover {
      color: var(--accent);
    }

    /* TOP GRAY SECTION */

    .top-section {
      background: var(--gray);
      padding: 75px 30px 90px;
      text-align: center;
    }

    .top-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 45px;
      font-size: clamp(46px, 7vw, 76px);
      line-height: 1.05;
      letter-spacing: -2.5px;
      font-weight: 800;
    }

    .about-photo {
      display: block;
      width: 360px;
      max-width: 100%;
      height: 540px;
      object-fit: cover;
      object-position: center 20%;
      margin: 0 auto;
      border-radius: 3px;
    }

    /* STORY */

    .story-section {
      background: var(--white);
      padding: 90px 30px;
    }

    .story-inner {
      max-width: 1000px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 65px;
      align-items: center;
    }

    .story-text {
      max-width: 680px;
    }

    h2 {
      margin: 0 0 35px;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.15;
      letter-spacing: -1.2px;
      font-weight: 800;
    }
